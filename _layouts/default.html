<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }}</title>
  <style>
    body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; max-width: 760px; margin: 0 auto; padding: 2rem 1rem; line-height: 1.75; color: #1a1a1a; }
    a { color: #0366d6; text-decoration: none; }
    a:hover { text-decoration: underline; }
    h1, h2, h3 { line-height: 1.3; }
    img { max-width: 100%; height: auto; }
    code { background: #f4f4f4; padding: 2px 4px; border-radius: 4px; }
    pre { background: #f4f4f4; padding: 1rem; overflow: auto; border-radius: 6px; }
    blockquote { border-left: 4px solid #ddd; margin: 1rem 0; padding: 0 1rem; color: #555; }
  </style>
</head>
<body>
  <main>
    {{ content }}
  </main>
</body>
</html>
